# ============================================
# Spring Boot Application Configuration
# Lodgings & Restaurant Management System
# ============================================

# Server Configuration
server.port=8080
spring.application.name=Lodging Management System

# ============================================
# MySQL Database Configuration
# ============================================

# Database URL - connect to lodging_db database on localhost
spring.datasource.url=jdbc:mysql://localhost:3306/lodging_db

# MySQL username (default is 'root')
spring.datasource.username=root

# MySQL password (change this to your actual password)
spring.datasource.password=

# MySQL driver class
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA Configuration
# ============================================

# Show SQL queries in console (helpful for debugging)
spring.jpa.show-sql=true

# Format SQL queries for better readability
spring.jpa.properties.hibernate.format_sql=true

# Hibernate dialect for MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Hibernate DDL strategy - update creates tables if they don't exist
spring.jpa.hibernate.ddl-auto=update

# ============================================
# Thymeleaf Configuration
# ============================================

# Enable Thymeleaf caching (set to false for development for instant template refresh)
spring.thymeleaf.cache=false

# Thymeleaf template location (default: src/main/resources/templates)
spring.thymeleaf.prefix=classpath:/templates/

# Thymeleaf template suffix
spring.thymeleaf.suffix=.html

# Enable full stack trace in error pages
server.error.include-binding-errors=always

# ============================================
# Development Configuration
# ============================================

# Logging level
logging.level.root=INFO
logging.level.com.lodging.project=DEBUG

# Enable detailed error messages
server.error.include-message=always
server.error.include-stacktrace=always
