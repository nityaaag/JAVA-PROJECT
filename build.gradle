plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.lodging'
version = '1.0.0'
sourceCompatibility = '21'

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Web Starter - for building web applications
    implementation 'org.springframework.boot:spring-boot-starter-web'
    
    // Spring Data JPA - for database operations using ORM (Object-Relational Mapping)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    
    // Thymeleaf - for rendering HTML templates with dynamic data
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    
    // MySQL Connector - for connecting to MySQL database
    runtimeOnly 'com.mysql:mysql-connector-j'
    
    // Lombok - for reducing boilerplate code (optional but recommended)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    // Spring Boot DevTools - for automatic restart during development
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    
    // JUnit testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
